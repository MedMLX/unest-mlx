[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unest-mlx"
version = "0.2.7"
description = "Segment kidney cortex, medulla and collecting system in contrast-enhanced CT with UNesT and native MLX"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
  "mlx",
  "apple-silicon",
  "metal",
  "medical-imaging",
  "unest",
  "kidney",
  "ct",
  "segmentation",
  "monai",
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Joseph Sandoval" },
  { name = "Alfredo Sandoval Jr." },
]
dependencies = [
  "medmlx-core==0.2.6",
  "mlx==0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "nibabel>=5.3,<6",
  "numpy>=2.0,<3",
]

[project.entry-points."medmlx.models"]
unest = "unest_mlx.medmlx:MODEL"

[project.urls]
Homepage = "https://medmlx.org"
Documentation = "https://github.com/MedMLX/unest-mlx/blob/v0.2.7/README.md"
Repository = "https://github.com/MedMLX/unest-mlx"
Issues = "https://github.com/MedMLX/unest-mlx/issues"
Weights = "https://huggingface.co/MedMLX/unest-renal-ct-mlx"
MedMLX = "https://github.com/MedMLX/medmlx"

[project.optional-dependencies]
dev = [
  "pyright==1.1.414",
  "torch==2.13.0",
  "monai==1.6.1",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/unest_mlx"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["mlx: native MLX execution requiring Apple Silicon Metal"]

[tool.uv]
constraint-dependencies = ["setuptools>=84.1.0", "filelock>=4.2.1", ]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["TID251", "TID252", "ANN401"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["scripts","src","tests"]
extraPaths = ["src", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}
"typing_extensions.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}

[tool.hatch.build.targets.sdist]
only-include = [
  "src/unest_mlx",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
